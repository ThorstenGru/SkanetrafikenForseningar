name: Build content pages
description: >
  Builds every published page from a SINGLE pass over the database
  (src/build_all.py), then preserves the independently-built status page.
  Shared by build.yml, backfill.yml, and deploy-pages.yml -- previously each
  repeated the same four steps verbatim, and before that each of those four
  steps was its own process re-running the same full-window query (see
  build_all.py's own docstring on why that had to stop).

inputs:
  database-url:
    required: true
  sommarbiljett-purchased-at:
    required: true
  supabase-anon-key:
    required: true
  claim-tracking-passphrase:
    required: true
  data-quality:
    description: >
      "true" to also write a data_quality_runs bookkeeping row. Only the
      scheduled build does this -- a manual backfill or a plain republish
      shouldn't add rows to a table that exists to track the live pipeline's
      own health over time.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build all pages (single database pass)
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        SOMMARBILJETT_PURCHASED_AT: ${{ inputs.sommarbiljett-purchased-at }}
        SUPABASE_ANON_KEY: ${{ inputs.supabase-anon-key }}
        CLAIM_TRACKING_PASSPHRASE: ${{ inputs.claim-tracking-passphrase }}
      run: |
        EXTRA=""
        if [ "${{ inputs.data-quality }}" != "true" ]; then
          EXTRA="--skip-data-quality"
        fi
        python src/build_all.py --out-dir pages_site $EXTRA

    - name: Preserve status page (built independently by status.yml)
      shell: bash
      run: curl -sfL https://thorstengru.github.io/SkanetrafikenForseningar/status.html -o pages_site/status.html || echo "status.html not live yet, skipping"
