name: Scan Skånetrafiken delays

# CAPTURE ONLY. This workflow writes to Postgres and reads essentially
# nothing back (scan.py's own lookups come from the local static SQLite
# index), which makes it close to free on Supabase's egress meter. Page
# rendering -- which is where all the egress actually was -- moved to
# build.yml on 2026-08-06.
#
# That split is what lets this keep the tightest schedule the platform will
# give us. Polling cadence IS the data quality here: GTFS-RT is a live
# snapshot, not a log, so anything missed between two polls is missed
# permanently. Note that GitHub delivers nowhere near the requested */15 --
# measured 2026-08-06, actual delivery was ~12-14 runs/day with gaps of 1h
# to 3.5h, including during peak daytime service. Asking for every 15
# minutes is asking for as much as the platform will hand over, not a
# description of what actually happens; see docs/RUNBOOK.md.

on:
  # Scheduled polling stopped 2026-08-18 at the user's own request: one
  # final full pull was run manually, then this cron was removed rather
  # than left in place unused -- resuming live capture just means restoring
  # the `schedule:` block below (`cron: "*/15 * * * *"`), not a rebuild of
  # anything. workflow_dispatch stays available for a manual one-off pull.
  workflow_dispatch:
    inputs:
      force_static_refresh:
        description: "Force-rebuild the static index (routes/stops/lat-lon cache) even if not stale yet"
        default: "false"

permissions:
  contents: write

concurrency:
  group: skanetrafiken-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Normal runs take ~1-2 min. Bounded so a hung Trafiklab/Supabase call
    # can't occupy this concurrency group for hours and starve every
    # scheduled run behind it -- the same class of bug already fixed once
    # for scan-vs-backfill, just scan-vs-itself this time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Nothing below this point runs once the season is over -- there is no
      # such thing as new data for a window that has closed. scan.py enforces
      # the same rule itself for manual dispatches; this skips the work (and
      # every database connection) rather than relying on that alone.
      #
      # Placed after the install, not before: config.py resolves
      # ZoneInfo("Europe/Stockholm") at import time, and requirements.txt is
      # where tzdata comes from. Saving thirty seconds on a run that is
      # already doing nothing isn't worth making the guard itself depend on
      # the runner image shipping a system tz database. See
      # src/window_guard.py.
      - name: Season window guard
        id: guard
        run: python src/window_guard.py --phase scan >> "$GITHUB_OUTPUT"

      # stop_times_cache.sqlite (every trip's full timetable, for claims.html's
      # complete-journey view) is 150+ MB -- too big to commit to git (see
      # config.py's own note), so it round-trips through actions/cache
      # instead, keyed on the committed static_index.sqlite's own hash so it
      # naturally invalidates whenever that gets refreshed (~weekly).
      #
      # Restored/saved HERE rather than in build.yml because static_index.py
      # is what regenerates it, and this is the only workflow that refreshes
      # the static index on a schedule. build.yml restores it read-only.
      - name: Restore stop_times cache
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true  # a cache miss/service hiccup just means the complete-journey merge degrades gracefully, not a build failure
        uses: actions/cache/restore@v4
        with:
          path: data/stop_times_cache.sqlite
          key: stop-times-${{ hashFiles('data/static_index.sqlite') }}
          restore-keys: stop-times-

      - name: Run scanner
        if: steps.guard.outputs.should_run == 'true'
        env:
          TRAFIKLAB_STATIC_KEY: ${{ secrets.TRAFIKLAB_STATIC_KEY }}
          TRAFIKLAB_REALTIME_KEY: ${{ secrets.TRAFIKLAB_REALTIME_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_STATIC_REFRESH: ${{ github.event.inputs.force_static_refresh }}
        run: python src/scan.py

      # Second, independent rail-delay source (docs/TRAFIKVERKET_INTEGRATION.md)
      # -- ingestion only, never authoritative on its own (see
      # src/trafikverket_merge.py's hard rule: this data can enrich or
      # gap-fill, never override GTFS-RT). continue-on-error because this is
      # optional infrastructure -- a Trafikverket outage or rate limit must
      # not take down the scan pipeline.
      - name: Run Trafikverket scanner
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        env:
          TRAFIKVERKET_KEY: ${{ secrets.TRAFIKVERKET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/scan_trafikverket.py

      - name: Commit static index (routes/stops cache, changes ~weekly)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static_index.sqlite
          git diff --cached --quiet || git commit -m "Static index refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Retries: scan.yml and backfill.yml run in separate concurrency
          # groups on purpose (see backfill.yml's own note), so they can now
          # genuinely race on this push. A single pull+push attempt only
          # protects against a race that already happened before the pull.
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push && exit 0
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::git push failed after 3 attempts"
          exit 1

      # Re-evaluates the hash *now*, after a possible refresh above -- if
      # scan.py rebuilt the static index this run, this saves under a new
      # key reflecting the fresh timetable; otherwise the key matches what
      # was just restored and this is a harmless no-op (can't overwrite an
      # existing cache entry, nor does it need to).
      - name: Save stop_times cache
        # Never fails the job over this -- a cache save is an optimization
        # for future runs, not something this run's own success depends on
        # (and GH Actions cache keys are immutable, so re-saving under an
        # already-existing key is an expected, harmless no-op most runs).
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/stop_times_cache.sqlite
          key: stop-times-${{ hashFiles('data/static_index.sqlite') }}
