name: Cleanup delay noise (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Shares scan.yml's group deliberately: VACUUM FULL takes an ACCESS
# EXCLUSIVE lock on delays, which would otherwise block (or be blocked by)
# the live scanner's INSERTs for the run's whole duration. Serializing the
# two at the GH Actions level avoids that lock contention entirely.
concurrency:
  group: skanetrafiken-scan
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Raised from 15: the 2026-08-18 run got cancelled by THIS timeout
    # while still waiting on the DELETE itself (no "Deleted N" line ever
    # printed) -- the database is healthy and unblocked (db_activity_check.py
    # confirmed no blocking locks), it is just running unusually slowly
    # right now. Give it real room rather than repeatedly killing a query
    # that may simply need more than 15 minutes to finish.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete sub-5-minute noise and VACUUM FULL delays
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/cleanup_delay_noise.py
