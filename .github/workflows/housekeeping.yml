name: Daily housekeeping

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs through the post-season wind-down so the finished dataset gets a
      # final purge of anything outside the window, then stops permanently.
      # Placed after the install for the same reason scan.yml's is -- see its
      # own note. See src/window_guard.py and docs/RUNBOOK.md.
      - name: Season window guard
        id: guard
        run: python src/window_guard.py --phase housekeeping >> "$GITHUB_OUTPUT"

      - name: Coverage check (yesterday)
        if: steps.guard.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/coverage_check.py

      - name: Delete data outside the season window
        if: steps.guard.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/housekeeping.py
