name: Archive database (one-off)

# Project retired 2026-10-06. Dumps the public schema with pg_dump and uploads
# it ENCRYPTED: this repo is public and anyone signed in to GitHub can
# download a public repo's artifacts, and the dump contains claim_tracking.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install postgresql-client-17 (server is PG17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc -f skane.dump
          ls -l skane.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$ARCHIVE_PASSPHRASE" --symmetric --cipher-algo AES256 -o skane.dump.gpg skane.dump
          rm skane.dump
          ls -l skane.dump.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: skane-db-archive-encrypted
          path: skane.dump.gpg
          retention-days: 30
