name: Build and publish pages

# RENDER ONLY -- split out of scan.yml on 2026-08-06.
#
# Every byte of this project's Supabase egress comes from here: the scanner
# writes, these pages read. Previously the four page builds plus the data
# quality pass ran on EVERY scan (~14x/day), and each of the five opened its
# own connection and re-ran the same full-window query. That combination put
# the organisation at 16.25 GB against a 5.5 GB free-tier allowance, with
# every project in the org -- BliGlömd included -- due to start returning
# 402s on 2026-08-07.
#
# Two independent fixes: src/build_all.py collapsed the five query passes
# into one, and the cadence below decoupled rendering from capture. Scanning
# stays as frequent as GitHub will deliver (that IS the data quality);
# rendering does not need to, and never did.
#
# Every 3h is a deliberate choice, not a budget compromise. The dashboard is
# the only page with any real-time value and scans themselves only land every
# ~2h in practice, so building more often mostly re-renders identical bytes.
# The three claim pages are less time-sensitive still: config.py's own
# SKANETRAFIKEN_REGISTRATION_LAG_DAYS records Skånetrafiken support's advice
# to wait 1-2 DAYS before filing, so a page that is at most 3h old costs a
# rider nothing. No data is dropped, thinned or sampled anywhere -- the pages
# always render the complete season window.

on:
  # EVERY THIRD DAY -- sized against a measured cost, not a guess, and
  # against how little of this project's life is left.
  #
  # A build measures at ~671 MB of egress (src/egress_meter.py prints the
  # real figure in every build log). The organisation's free-tier allowance
  # is 5.5 GB/month, shared with BliGlömd's production database, so that is
  # roughly EIGHT FULL BUILDS PER MONTH. Every 3 hours -- the cadence this
  # workflow shipped with earlier today -- projected to 157 GB/30d. Even
  # once a day projects to 20 GB/30d. Collapsing five query passes into one
  # was a genuine ~10x improvement and still nowhere near enough: this
  # architecture assumes database reads are free, and on this tier reads are
  # the scarce resource.
  #
  # The season ends 2026-08-20, after which window_guard.py stops this
  # workflow permanently and the published site is static forever. From
  # 2026-08-06 that is ~6 more builds, ~4 GB total for the rest of the
  # project's life. Sizing the cadence to the remaining lifespan is the
  # proportionate fix; a per-day row cache to make builds incremental would
  # be the right answer for a project that had to keep running, and is not
  # worth putting under claim-critical code for two weeks.
  #
  # Raise this freely if the org ever gets an allowance that can absorb it.
  # Nothing here limits data: scan.py writes and barely reads, so collection
  # continues at full depth on its own */15 schedule regardless. A sparse
  # build cadence costs page freshness only -- and the claim pages are the
  # least freshness-sensitive thing here (COMPENSATION_RULES.md's own
  # 1-2 day registration lag, against a 2-month filing deadline).
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: skanetrafiken-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Raised from 20 alongside build_all.py's new statement_timeout='10min'
    # (2026-08-18): two builds in a row got QueryCanceled well under 20
    # minutes on ordinary queries against the season's final, largest data
    # volume. Gives a legitimately slow render room to finish instead of
    # the job timeout racing the query's own new ceiling.
    timeout-minutes: 40
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keeps building through a short wind-down after the season closes, so
      # the finished dataset is guaranteed at least one final render, then
      # stops permanently. Placed after the install for the same reason
      # scan.yml's is -- see its own note. See src/window_guard.py and
      # docs/RUNBOOK.md.
      - name: Season window guard
        id: guard
        run: python src/window_guard.py --phase build >> "$GITHUB_OUTPUT"

      - name: Restore stop_times cache
        # Read-only here: scan.yml owns regenerating and saving this (it is
        # static_index.py that writes it, and scan.yml is what refreshes the
        # static index). A cache miss just means claims.html degrades to the
        # sparse live-only stop list, not a build failure.
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: data/stop_times_cache.sqlite
          key: stop-times-${{ hashFiles('data/static_index.sqlite') }}
          restore-keys: stop-times-

      - name: Build content pages
        if: steps.guard.outputs.should_run == 'true'
        uses: ./.github/actions/build-content-pages
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          sommarbiljett-purchased-at: ${{ secrets.SOMMARBILJETT_PURCHASED_AT }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          claim-tracking-passphrase: ${{ secrets.CLAIM_TRACKING_PASSPHRASE }}
          # The scheduled build is the live pipeline, so it's the one that
          # should leave a data_quality_runs trail -- see the action's own
          # note on why backfills and republishes don't.
          data-quality: "true"

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.should_run == 'true'
        with:
          path: pages_site

  deploy:
    needs: build
    # Without this the deploy job would still fire on a skipped build and try
    # to publish an artifact that was never uploaded.
    if: needs.build.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Shared with status.yml's own deploy job, deliberately. GitHub Pages
    # accepts one deployment at a time; two workflows that each deploy but
    # sit in different concurrency groups don't queue politely, they both
    # start and the loser sits in `deployment_queued` until
    # actions/deploy-pages@v4 gives up ("Timeout reached, aborting!").
    # Observed twice on 2026-08-06 with build.yml and status.yml overlapping.
    # A shared group makes them serialise instead. cancel-in-progress stays
    # false: a queued deploy of freshly built pages should wait its turn, not
    # be thrown away.
    concurrency:
      group: skanetrafiken-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      # Whichever attempt below actually succeeded.
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    # Covers three 10-minute attempts plus the back-offs between them.
    timeout-minutes: 60
    steps:
      # THREE ATTEMPTS, not one long wait.
      #
      # GitHub Pages soft-throttles at roughly 10 deployments/hour, and while
      # throttled a deployment just sits in `deployment_queued` until
      # actions/deploy-pages gives up with "Timeout reached, aborting!". That
      # discarded three consecutive builds on 2026-08-06 and left the live
      # site four hours stale.
      #
      # Raising the action's own `timeout` input does NOT work: it is capped
      # at 600000 ms and anything larger is silently clamped back to ten
      # minutes ("Warning: timeout value is greater than the allowed
      # maximum"). Tried that first; the log said no. Retrying with a
      # back-off is the only lever the action actually gives you, and it
      # suits the failure mode better anyway -- a throttle window needs
      # waiting *out*, not a longer single poll.
      #
      # Worth the complexity because the artifact is expensive: the build
      # that produced it cost ~671 MB of Supabase egress, about an eighth of
      # the organisation's monthly allowance, and it only runs every third
      # day. Runner time is free on a public repo, so a 40-minute retry
      # sequence to protect that is the right trade. The shared concurrency
      # group means a long retry blocks only status.yml, which is cheap to
      # lose and re-runs by itself.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Back off before retry
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Deploy attempt 1 failed (Pages likely throttled). Waiting 7 minutes."
          sleep 420

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Back off before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Deploy attempt 2 failed. Waiting 10 minutes before the final attempt."
          sleep 600

      # Not continue-on-error: if the third attempt fails the job should go
      # red, because at that point the build really has been lost and it is
      # three days until the next scheduled one.
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
